:root{--tea:#CCD5AE;--papaya:#FAEDCD;--beige:#E9EDC9;--corn:#FEFAE0;--bronze:#D4A373;--ink:#5b4330;--ink2:#8c7458;--line:#e6dcc2;--paper:#fffdf6;font-family:'Pretendard',system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;color:var(--ink)}
body{background-color:#f7f9ee;background-image:linear-gradient(90deg,rgba(204,213,174,.32) 50%,transparent 50%),linear-gradient(rgba(204,213,174,.32) 50%,transparent 50%);background-size:46px 46px}
button,input,select,textarea{font:inherit;color:inherit}

/* header */
.top{height:68px;display:flex;align-items:center;gap:14px;padding:0 22px;background:var(--corn);border-bottom:2.5px solid var(--ink);position:relative;z-index:5}
.logo{font-family:'Bagel Fat One','Pretendard',sans-serif;font-size:30px;line-height:1;color:var(--ink);display:flex;align-items:center;gap:2px;white-space:nowrap}
.logo .hrt{color:var(--bronze);font-size:24px;margin:0 1px}
.logo .ex{margin-left:12px;color:var(--bronze);letter-spacing:.02em}
.logo small{font-family:'Gowun Batang',serif;font-weight:700;font-size:17px;margin-left:10px;color:var(--ink2)}
.ico{width:28px;height:28px;border:2.5px solid var(--tea);border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#a9b787;font-size:14px;flex:none}
.top .sw{display:flex;gap:4px;margin-left:4px}.top .sw i{width:12px;height:12px;border-radius:3px;display:block}
.top .grow{flex:1}
.pill-search{display:flex;align-items:center;gap:8px;height:34px;padding:0 6px 0 14px;border-radius:999px;background:var(--tea);font-size:12px;color:#4d5a33;max-width:340px;min-width:0}
.pill-search span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill-search b{width:24px;height:24px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}

/* layout */
.app{display:grid;grid-template-columns:450px 1fr;height:calc(100vh - 68px)}
.side{padding:16px 10px 16px 16px;min-height:0;display:flex;flex-direction:column;gap:12px}
.modeT{display:flex;padding:5px;background:var(--paper);border:2px solid var(--ink);border-radius:999px;box-shadow:4px 4px 0 var(--tea);flex:none}
.modeT button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 0;font-size:14.5px;font-weight:800;cursor:pointer;color:var(--ink2)}
.modeT button.on{background:var(--ink);color:var(--corn)}
.panes{flex:1;overflow:auto;min-height:0;padding:2px 8px 30px 2px;display:flex;flex-direction:column;gap:14px}
.sec{background:var(--paper);border:2px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--tea);position:relative}
.sec[hidden]{display:none}
.sec>header{display:flex;align-items:center;gap:8px;padding:14px 16px;cursor:pointer;user-select:none}
.sec>header b{font-size:15px;font-weight:800}
.sec>header b::before{content:"✦";color:var(--bronze);margin-right:6px}
.sec>header .no{margin-left:auto;font-size:11.5px;font-weight:800;color:var(--ink2);letter-spacing:.04em}
.sec>header .cv{width:22px;height:22px;border:1.5px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink2);transition:.2s}
.sec.closed>header .cv{transform:rotate(-90deg)}
.sec>.body{padding:0 16px 16px;border-top:1.5px dashed var(--line)}
.sec.closed>.body{display:none}
.lblrow{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
.lblrow b{font-size:13px;font-weight:800}
h4{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-size:13px;font-weight:800;color:var(--ink)}
h4::before{content:"";width:32px;height:9px;flex:none;background:linear-gradient(90deg,var(--ink) 0 9px,transparent 9px 11px,var(--tea) 11px 20px,transparent 20px 22px,var(--beige) 22px 31px)}
h4::after{content:"";flex:1;border-top:1.5px dashed var(--line)}
.row{display:grid;grid-template-columns:98px 1fr;align-items:center;gap:10px;margin:7px 0;font-size:13px}
.row>label{color:var(--ink2)}
.val{color:var(--ink);font-weight:800;font-size:12px;margin-left:5px}
.ctl{display:flex;gap:6px;align-items:center;min-width:0}
.ctl input[type=range]{width:100%;accent-color:var(--bronze)}
.ctl input[type=text],.ctl select{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:6px 9px;background:#fff;font-size:13px;min-width:0}
input[type=color]{width:34px;height:30px;border:1.5px solid var(--line);border-radius:8px;padding:2px;background:#fff;flex:none;cursor:pointer}
.hex{font-family:'Nanum Gothic Coding',monospace;font-size:12px!important}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.seg button.on{background:var(--tea);border-color:var(--ink);font-weight:700}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;margin:7px 0;cursor:pointer}
.chk input{accent-color:var(--bronze);width:15px;height:15px}
.btn{border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--corn)}
.btn.pri{background:var(--bronze);color:#fff;box-shadow:2px 2px 0 var(--ink)}
.btn.pri:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn.sm{padding:3px 11px;font-size:12px}
.btn.tea{background:var(--tea)}
.btn.wide{width:100%;padding:11px;border-radius:12px;font-weight:700;font-size:14px;background:#fff}
.btn.wide:hover{background:var(--corn)}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
/* switch */
.switch{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:800;cursor:pointer;margin:14px 0 4px}
.switch input{display:none}
.switch i{width:42px;height:24px;border-radius:999px;background:var(--line);position:relative;transition:.2s;flex:none;border:1.5px solid var(--ink)}
.switch i::after{content:"";position:absolute;left:2px;top:2px;width:17px;height:17px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);transition:.2s}
.switch input:checked+i{background:var(--bronze)}
.switch input:checked+i::after{left:19px}
/* editor */
.editor{border:1.5px solid var(--ink);border-radius:12px;background:#fff;position:relative}
.tool{display:flex;flex-wrap:wrap;align-items:center;gap:3px;padding:7px 8px;border-bottom:1.5px solid var(--line);background:var(--corn);border-radius:12px 12px 0 0}
.tool button{border:0;background:transparent;border-radius:7px;min-width:28px;height:28px;padding:0 6px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;font-weight:700;color:var(--ink)}
.tool button:hover{background:#fff}
.tool .vs{width:1px;height:18px;background:var(--line);margin:0 3px}
.tool .tH{border:1.5px solid var(--line);background:#fff;font-weight:900}
.tool .tA{border:1.5px solid var(--line);background:#fff;font-weight:900;font-family:'Bagel Fat One','Pretendard',sans-serif;font-weight:400}
.tool .dotb{min-width:0;width:18px;height:18px;padding:0;border-radius:50%;border:1.5px solid rgba(0,0,0,.12)}
.tool .dotb:hover{transform:scale(1.15);background:inherit}
.tool .caret{min-width:0;width:22px;height:22px;border:1.5px solid var(--ink);font-size:11px;padding:0}
.tool .caret.on{background:var(--ink);color:var(--corn)}
.tool .txtb{font-weight:600;font-size:12.5px}
#txt{display:block;width:100%;min-height:300px;border:0;border-radius:0 0 12px 12px;padding:12px 14px;font-size:14px;line-height:1.65;resize:vertical;background:#fff;outline:none;background-image:linear-gradient(transparent calc(1.65em - 1px),rgba(204,213,174,.45) 0);background-size:100% 1.65em;background-attachment:local;background-position:0 12px}
textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;resize:vertical;background:#fff}
/* color popup */
.cpop{position:absolute;right:8px;top:46px;width:min(330px,calc(100% - 16px));background:#fff;border:2px solid var(--ink);border-radius:16px;box-shadow:4px 4px 0 var(--tea);padding:14px;z-index:20}
.cp-head{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cp-tabs{display:flex;gap:4px}
.cp-tabs button{border:0;background:transparent;border-radius:8px;padding:4px 9px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink2)}
.cp-tabs button.on{background:var(--corn);color:var(--ink)}
.cp-x{margin-left:auto;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:#fff;cursor:pointer}
.cp-slots{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--corn);border-radius:999px;padding:4px;margin-bottom:12px}
.cp-slots button{border:0;border-radius:999px;background:transparent;padding:7px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px}
.cp-slots button i{width:10px;height:10px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.15)}
.cp-slots button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.cp-lbl{font-size:12px;font-weight:800;margin:6px 0}
.cp-row{display:flex;gap:6px;align-items:center}
.cp-row input[type=color]{width:46px;height:42px;border-radius:10px}
.cp-row input[type=text]{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;font-family:'Nanum Gothic Coding',monospace;font-size:13px}
.cp-drop{border:1.5px solid var(--ink);background:var(--corn);border-radius:10px;height:42px;padding:0 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.cp-sw{display:flex;gap:8px;margin:12px 0 6px;flex-wrap:wrap}
.cp-sw button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.cp-sw button.on{box-shadow:0 0 0 2px var(--ink)}
.cp-al{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12.5px}
.cp-al input{flex:1;accent-color:var(--bronze)}
.cp-prev{margin-top:12px;background:var(--corn);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600}
/* misc */
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}
.thumb{position:relative;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;aspect-ratio:1;background:var(--corn) center/cover no-repeat;cursor:pointer}
.thumb b{position:absolute;left:4px;top:4px;background:var(--ink);color:var(--corn);border-radius:5px;padding:1px 6px;font-size:11px}
.thumb.main::after{content:"본문 이미지";position:absolute;left:0;right:0;bottom:0;background:var(--bronze);color:#fff;font-size:10px;text-align:center;font-weight:700;padding:1px}
.thumb .x{position:absolute;right:3px;top:3px;border:0;background:#fff;border-radius:5px;width:20px;height:20px;cursor:pointer;font-size:11px}
.box{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:10px 0;background:#fff}
.box .hd{display:flex;align-items:center;gap:8px;margin-bottom:4px;font-size:13px}
.avp{width:34px;height:34px;border-radius:50%;background:#ddd center/cover;flex:none;border:1.5px solid var(--ink)}
.help{font-size:12.5px;color:var(--ink2);line-height:1.75}
.help code{background:var(--corn);border:1px solid var(--line);border-radius:5px;padding:0 5px;font-family:'Nanum Gothic Coding',monospace;color:var(--ink);font-size:12px}
.help table{border-collapse:collapse;width:100%}.help td{padding:4px;border-bottom:1px dashed var(--line);vertical-align:top}
details.guide{border:1.5px solid var(--line);border-left:4px solid var(--tea);border-radius:10px;padding:0 12px;margin:10px 0;background:#fff}
details.guide summary{cursor:pointer;font-size:13px;font-weight:800;padding:10px 0;list-style:none;display:flex;align-items:center;gap:6px}
details.guide summary::after{content:"⌄";margin-left:auto;color:var(--ink2)}
details.guide[open] summary::after{content:"⌃"}
.note{font-size:12px;color:var(--ink2);line-height:1.6;background:var(--corn);border:1px dashed var(--line);border-radius:10px;padding:8px 11px;margin:8px 0}
.list{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.list .it{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:5px 8px;font-size:13px;background:#fff}
.list .it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reco{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.reco button{border:1.5px solid var(--ink);border-radius:10px;padding:10px;text-align:left;cursor:pointer;font-size:12.5px;line-height:1.35;font-weight:700}
.reco button i{display:block;font-style:normal;font-size:11px;font-weight:500;opacity:.75}
.stk-row{display:grid;grid-template-columns:52px 1fr;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:8px;margin:8px 0;background:#fff}
.stk-row.sel{border-color:var(--bronze);background:#fffaf0}
.stk-row .tb{width:52px;height:52px;border-radius:8px;background:var(--corn) center/contain no-repeat;border:1.5px solid var(--line);cursor:pointer}
.empty{font-size:12.5px;color:var(--ink2);border:1.5px solid var(--line);border-left:4px solid var(--tea);border-radius:10px;padding:10px 12px;margin-top:10px;background:#fff}
.posgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.posgrid button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:6px 0 5px;cursor:pointer;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:4px}
.posgrid button.on{border-color:var(--ink);background:var(--tea);font-weight:700}
.posgrid svg{width:30px;height:38px}
.barcode{display:flex;align-items:flex-end;gap:2px;height:26px;margin:22px 0 4px;opacity:.75}
.barcode i{display:block;background:var(--ink);height:100%}
.foot-note{font-family:'Dancing Script',cursive;font-size:17px;color:var(--bronze)}
[hidden]{display:none!important}

/* stage */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;padding:16px 16px 16px 6px}
.stagewrap{flex:1;display:flex;flex-direction:column;border:2px solid var(--ink);border-radius:6px;background-color:var(--corn);background-image:linear-gradient(rgba(204,213,174,.55) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(204,213,174,.55) 1.5px,transparent 1.5px);background-size:30px 30px;min-height:0;position:relative;overflow:hidden}
.bar{display:flex;align-items:center;gap:6px;padding:10px 12px;flex-wrap:wrap;background:rgba(254,250,224,.92);border-bottom:2px solid var(--ink)}
.bar .z{font-size:12.5px;min-width:52px;text-align:center;font-weight:700;border:1.5px solid var(--ink);border-radius:50%/60%;padding:3px 6px;background:#fff}
.bar .grow{flex:1}
.warn{font-size:12px;color:#8a3b25;background:#fbe3d4;border:1.5px solid #d89a7a;border-radius:999px;padding:3px 10px}
#stage{flex:1;overflow:auto;padding:34px 60px 34px 34px;position:relative}
#holder{margin:0 auto;position:relative}
#scaler{transform-origin:0 0;position:absolute;left:0;top:0;box-shadow:6px 6px 0 rgba(91,67,48,.18)}
.vol{position:absolute;right:14px;top:66px;writing-mode:vertical-rl;font-family:'Gowun Batang',serif;font-size:22px;color:var(--ink2);letter-spacing:.08em;pointer-events:none;opacity:.8}
.vol b{font-family:'Bagel Fat One',sans-serif;font-weight:400;color:var(--bronze)}
.stfoot{display:flex;align-items:center;gap:12px;padding:8px 16px;border-top:2px solid var(--ink);background:var(--paper);font-size:12px}
.stfoot .new{border:1.5px solid var(--ink);border-radius:50%;padding:2px 14px;font-family:'Dancing Script',cursive;font-size:15px}
.stfoot .ln{flex:1;border-top:1.5px solid var(--ink);max-width:180px}
.stfoot .icons{letter-spacing:6px;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:10px 22px;border-radius:999px;font-size:13.5px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90vw;box-shadow:3px 3px 0 var(--tea);display:flex;align-items:center;gap:12px}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast button{border:1.5px solid var(--ink);background:var(--tea);border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(60,48,30,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal .mbox{background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:18px;max-width:min(720px,96vw);max-height:94vh;display:flex;flex-direction:column;gap:12px;box-shadow:6px 6px 0 var(--tea)}
.modal img{max-width:100%;max-height:66vh;object-fit:contain;border-radius:8px;align-self:center;border:1.5px solid var(--line)}
.modal .msg{font-size:13px;color:var(--ink2);line-height:1.6}
.modal .ttl{font-family:'Bagel Fat One',sans-serif;font-size:22px}
@media (max-width:900px){
  .top{height:auto;padding:12px 14px;flex-wrap:wrap}.pill-search{display:none}
  .app{grid-template-columns:1fr;height:auto}
  .main{order:-1;height:56vh;position:sticky;top:0;z-index:4;padding:10px}
  .side{padding:6px 10px 20px}.panes{overflow:visible}
  #stage{padding:16px 40px 16px 16px}
}

/* card */
#card{position:relative;overflow:hidden;color:var(--tc);font-family:var(--ff);font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls);word-break:keep-all;overflow-wrap:anywhere}
#bgLayer,#bgOv,#bgHtml,#stickers,#deco{position:absolute;left:0;top:0;right:0;bottom:0}
#bgLayer{z-index:0}#bgOv{z-index:1}
#bgHtml{overflow:hidden}
#bgHtml [data-layer="top"]{z-index:60!important}
#deco{z-index:40;pointer-events:none}
#content{position:absolute;left:0;top:0;right:0;bottom:0;padding:var(--pad);display:flex;flex-direction:column;z-index:50}
#card.fit #content{position:relative;min-height:var(--minh)}
.cwrap{flex:1;display:flex;flex-direction:column;min-height:0;gap:var(--mgap)}
.cwrap.p-bottom{flex-direction:column-reverse}
.cwrap.p-left{flex-direction:row}
.cwrap.p-right{flex-direction:row-reverse}
.mimg{flex:none;background-size:cover;background-position:center;background-repeat:no-repeat;cursor:grab}
[data-img]{cursor:grab}
.preview [data-img]{cursor:default}
#stickers{z-index:70;pointer-events:none}
.stk{position:absolute;pointer-events:auto;cursor:move;touch-action:none}
.stk.lock{pointer-events:none}
.stk img{display:block;pointer-events:none;user-select:none;position:relative}
.stk.sel{outline:3px dashed #d4a373;outline-offset:4px}
.preview .stk.sel{outline:none}
.cmid{flex:1;display:flex;flex-direction:column;justify-content:flex-start;min-height:0;min-width:0}
.va-center .cmid{justify-content:center}.va-bottom .cmid{justify-content:flex-end}
.stretch{transform-origin:0 0}
.ctext{column-gap:2.2em}
.ctext.jus .c-p{text-align:justify}
.ctext.ind .c-p{text-indent:1em}
.ctext.novel{position:relative}
.ctext.novel .c-p{text-align:justify;text-indent:1em}
.novel-line{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--tc);opacity:.25}
.c-p{margin:0 0 .4em}
.c-gap{height:calc(var(--lh)*1em)}
.c-h1{font-size:1.6em;font-weight:700;line-height:1.35;margin:.25em 0 .35em}
.c-h2{font-size:1.3em;font-weight:700;line-height:1.4;margin:.25em 0 .3em}
.c-h3{font-size:1.08em;font-weight:700;opacity:.85;margin:.2em 0 .25em}
.c-quote{border-left:.2em solid var(--qc);padding:.1em 0 .1em .8em;margin:.45em 0}
.c-sys{display:table;margin:.7em auto;font-size:.68em;line-height:1.5;padding:.42em 1.3em;border-radius:999px;background:var(--sysbg);text-align:center}
.c-hr{display:flex;align-items:center;gap:.8em;margin:.9em 0;font-size:.68em;opacity:.65}
.c-hr::before,.c-hr::after{content:"";flex:1;height:1px;background:var(--tc)}
.c-hr.plain::after{display:none}
.c-tr{font-size:.7em;opacity:.6;margin:.1em 0 .45em}
.c-tm{font-size:.62em;opacity:.55;margin-left:.4em;white-space:nowrap}
mark.hl1{background:var(--hl1);color:inherit;padding:0 .1em;border-radius:.12em}
mark.hl2{background:var(--hl2);color:inherit;padding:0 .1em;border-radius:.12em}
.cen{background:var(--tc);color:transparent;border-radius:.08em}
.ph{display:block;width:100%;background-size:cover;background-repeat:no-repeat;margin:.5em 0}
.msg{display:flex;gap:.5em;align-items:flex-end;margin:.45em 0}
.msg.R{flex-direction:row-reverse}
.msg.cont{margin-top:.15em}
.av{width:1.45em;height:1.45em;border-radius:50%;flex:none;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:.8em;font-weight:700}
.mav{width:1.75em;height:1.75em;border:.13em solid;box-sizing:border-box;margin-bottom:.05em}
.av.ghost{visibility:hidden}
.mcol{display:flex;flex-direction:column;align-items:flex-start;max-width:var(--bmw);min-width:0}
.R .mcol{align-items:flex-end}
.mname{font-size:.55em;opacity:.75;margin:.1em .4em .3em}
.mrow{display:flex;align-items:flex-end;gap:.35em}
.R .mrow{flex-direction:row-reverse}
.bub{padding:.6em .95em;border-radius:var(--br);line-height:1.6;font-size:var(--bfs)}
.bub.photo{padding:0;overflow:hidden;background:none!important}
.bub .ph{width:14em;margin:0}
.mtime{font-size:.52em;opacity:.55;white-space:nowrap;margin-bottom:.2em}
.mtr{font-size:.66em;opacity:.65;margin:.3em .5em 0}
.btr{display:block;font-size:.72em;opacity:.62;margin-top:.2em;line-height:1.5}
.bub.photo .btr{padding:.4em .8em .5em}
.tl{position:relative;padding:0 0 .9em 1.7em}
.tl::before{content:"";position:absolute;left:calc(.475em - 2px);top:.5em;bottom:-.5em;width:4px;border-radius:2px;background:var(--tc);opacity:.22}
.tl.last::before{display:none}
.tl-dot{position:absolute;left:0;top:.42em;width:.95em;height:.95em;border-radius:50%;border:3px solid var(--tc);z-index:1}
.tl-head{display:flex;align-items:center;gap:.45em;font-size:.72em;margin-bottom:.15em}
.tl-head .av{width:1.9em;height:1.9em;font-size:.8em}
.tl-head .tm{opacity:.55}
.tl-card{display:inline-block;padding:.55em .9em;border-radius:.55em;max-width:var(--bmw);font-size:var(--bfs);line-height:1.6}
.tl .ph{width:12em}
.gm{display:flex;margin:1.05em 0 .5em}
.gm.R{justify-content:flex-end}
.gm.cont{margin-top:.5em}
.gport{width:2.7em;height:2.7em;border-radius:.45em;font-size:1.1em;flex:none;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-weight:700}
.gbox{position:relative;display:flex;align-items:center;gap:.85em;flex:1 1 auto;max-width:var(--bmw);font-size:var(--bfs);line-height:1.6;padding:1em 1.1em .9em;border-radius:.55em;border:.12em solid;border-bottom-width:.3em}
.gname{position:absolute;top:-.95em;left:.9em;font-size:.68em;padding:.15em .95em;border-radius:999px;font-weight:700;line-height:1.5}
.R .gname{left:auto;right:.9em}
.gm.R .gbox{flex-direction:row-reverse}
.gm.R .gnext{right:auto;left:.75em}
.gsep{align-self:stretch;width:2px;flex:none;opacity:.45;border-radius:2px}
.gtxt{flex:1;min-width:0}
.gnext{position:absolute;right:.75em;bottom:.25em;font-size:.5em;opacity:.6}
.gtr{display:block;font-size:.7em;opacity:.65;margin-top:.2em}
.scr{display:grid;grid-template-columns:5em 1fr;gap:.9em;margin:.3em 0}
.scr .n{font-weight:700;text-align:right}
.scr .tr2{display:block;font-size:.72em;opacity:.6}
/* divider */
.c-hr2{display:flex;align-items:center;gap:.7em;margin:1em auto;font-size:.8em;opacity:.75;color:var(--hc,var(--tc))}
.c-hr2.cc{opacity:1}
.c-hr2 i{flex:1;height:0;border-top:var(--ht,2px) solid var(--hc,var(--tc))}
.c-hr2.nosym{gap:0}
.c-hr2.hs-dotted i{border-top-style:dotted}
.c-hr2.hs-double i{border-top:calc(var(--ht,2px)*3) double var(--hc,var(--tc))}
.c-hr2.hs-none i{border-top-color:transparent}
.c-hr2 b{font-weight:400;line-height:1}
/* icons */
.ic-mg{position:relative;display:inline-block;width:1em;height:1em;vertical-align:middle}
.ic-mg::before{content:"";position:absolute;left:0;top:0;width:.62em;height:.62em;border:.13em solid var(--icc);border-radius:50%}
.ic-mg i{position:absolute;left:.66em;top:.74em;width:.38em;height:.13em;background:var(--icc);transform:rotate(45deg);border-radius:.1em}
.ic-bg{display:inline-flex;flex-direction:column;justify-content:space-between;width:.95em;height:.78em;vertical-align:middle}
.ic-bg i{display:block;height:.13em;background:var(--icc);border-radius:.1em}
/* concepts — shared */
.cx-mid{justify-content:flex-start!important}
.cx{font-size:var(--cxs,140%);line-height:1.6;color:#1d1d1f;letter-spacing:0}
.cx p{margin:0 0 .7em}
.cx .ph{margin:.6em 0;border-radius:.4em}
.cx-fix{height:calc(var(--minh) - var(--pad)*2);display:flex;flex-direction:column;overflow:hidden}
.cx-svw{position:relative;flex:1;min-height:0;display:flex}
.cx-sv{flex:1;min-height:0;overflow:hidden;position:relative}
.cx-phone{min-height:calc(var(--minh) - var(--pad)*2);border-radius:1.3em;overflow:hidden;display:flex;flex-direction:column}
#card.fit .cx-phone{min-height:0}
.dm-hav,.dm-av,.yt-av,.x-av,.ms-av{box-shadow:0 0 0 1px rgba(0,0,0,.1)}
/* news */
.cx-news{background:#fff;border-radius:.4em;padding:1.1em 1.3em 1.3em;box-shadow:0 .2em 1em rgba(0,0,0,.08);font-family:'Pretendard',sans-serif}
.nw-top{display:flex;align-items:center;border-bottom:1px solid #e3e3e3;padding-bottom:.6em;margin-bottom:.9em}
.nw-top b{font-size:1.15em;font-weight:800;letter-spacing:-.02em}
.nw-tr{margin-left:auto;display:flex;align-items:center;gap:.6em;font-size:.62em;color:#666}
.nw-sec{font-size:.65em;font-weight:800;color:var(--ac);margin-bottom:.4em}
.nw-title{font-size:1.4em;font-weight:800;line-height:1.38;letter-spacing:-.03em}
.nw-meta{display:flex;align-items:flex-end;font-size:.56em;color:#777;padding:.8em 0 .9em;border-bottom:1px solid #e3e3e3;margin-bottom:1em;line-height:1.7}
.nw-meta b{color:#222;margin-left:.6em}
.nw-tools{margin-left:auto;display:flex;gap:1em;font-size:1.3em;color:#444}
.nw-tools sup{font-size:.55em}
.nw-sum{border-left:.22em solid #222;padding:.1em 0 .1em .8em;font-weight:800;font-size:.82em;line-height:1.55;margin-bottom:1em}
.nw-fig{margin:0 0 1em}.nw-fig .ph{border-radius:0;margin:0}.nw-fig figcaption{font-size:.56em;color:#888;margin-top:.5em}
.nw-body{font-size:.84em;line-height:1.85;color:#222}
.nw-body .nw-q{font-weight:700}
.nw-body blockquote{margin:.6em 0;padding:.3em .9em;border-left:3px solid var(--ac);background:#f6f7fb}
.nw-body h3{font-size:1em;margin:.8em 0 .4em}
.nw-react{display:flex;flex-wrap:wrap;gap:.5em;margin:.6em 0 1em}
.nw-react span{font-size:.56em;border:1px solid #ddd;border-radius:999px;padding:.35em 1em;color:#444}
.nw-react b{font-weight:700}
.nw-rep{display:flex;align-items:center;background:#e8eef9;border-radius:.4em;padding:.8em 1em;margin-bottom:1.1em}
.nw-rep div{display:flex;flex-direction:column;line-height:1.5}.nw-rep b{font-size:.68em}.nw-rep span{font-size:.52em;color:#777}
.nw-subbtn{margin-left:auto;border:1.5px solid #1f3a8a;color:#1f3a8a;border-radius:999px;padding:.25em .9em;font-size:.56em!important;font-weight:800}
.nw-list{margin-bottom:1em;font-size:.62em;line-height:1.9;color:#333}
.nw-list b{display:block;font-size:1.12em;margin-bottom:.2em;color:#111}
.nw-list em{font-style:normal;font-weight:800;color:var(--ac);display:inline-block;width:1.6em}
/* receipt */
.cx-rcw{display:flex;justify-content:center;filter:drop-shadow(0 .35em .7em rgba(60,50,80,.18))}
.cx-rc{position:relative;background:var(--pp);color:#3a3d4a;font-family:'Nanum Gothic',sans-serif;padding:1.6em 1.4em 1.8em;font-size:.78em;line-height:1.65;
  background-image:radial-gradient(120% 60% at 20% 0%,rgba(255,255,255,.9),transparent 60%),repeating-linear-gradient(0deg,rgba(0,0,0,.012) 0 2px,transparent 2px 5px);
  -webkit-mask:radial-gradient(circle at 8px 0,transparent 6px,#000 6.5px) -8px 0/16px 51% repeat-x top,radial-gradient(circle at 8px 100%,transparent 6px,#000 6.5px) -8px 100%/16px 51% repeat-x bottom;
  mask:radial-gradient(circle at 8px 0,transparent 6px,#000 6.5px) -8px 0/16px 51% repeat-x top,radial-gradient(circle at 8px 100%,transparent 6px,#000 6.5px) -8px 100%/16px 51% repeat-x bottom}
.rc-wel{text-align:center;font-family:'Cormorant Garamond',serif;letter-spacing:.42em;font-size:.72em;color:var(--ac);opacity:.85}
.rc-title{text-align:center;font-size:2.4em;line-height:1.15;color:var(--ac);margin:.05em 0 .1em}
.rc-names{text-align:center;font-family:'Cormorant Garamond',serif;font-weight:600;letter-spacing:.22em;font-size:.68em;color:var(--ac)}
.rc-photo{aspect-ratio:2.1/1;background:#ddd center/cover no-repeat;margin:.9em 0 .4em;border-radius:.2em}
.rc-meta{display:flex;justify-content:space-between;font-size:.72em;letter-spacing:.06em;margin-top:.7em;font-weight:700}
.rc-date{border-bottom:2px dotted var(--ac);color:var(--ac)}
.rc-cash{color:var(--ac)}
.rc-dash{border-top:2px dashed rgba(70,80,110,.35);margin:.5em 0}
.rc-row{display:flex;gap:.7em;align-items:baseline}
.rc-no{width:2.6em;flex:none;white-space:nowrap;color:#8b8fa3;font-size:.9em}
.rc-n{flex:1}.rc-n small{color:#8b8fa3}
.rc-p{text-align:right;white-space:nowrap}
.rc-head{font-size:.68em;letter-spacing:.14em;color:#8b8fa3;font-weight:700}
.rc-head .rc-no{font-size:1em}
.rc-sm{font-size:.72em;letter-spacing:.1em;color:#8b8fa3}
.rc-total{font-weight:800;font-size:1.05em;letter-spacing:.08em;color:var(--acd)}
.rc-note{font-size:.8em;color:#777;padding-left:2.7em}
.rc-bc{display:flex;justify-content:center;gap:2px;height:2.6em;margin:1em 0 .3em}.rc-bc i{display:block;background:var(--acd)}
.rc-foot{text-align:center;font-size:.62em;letter-spacing:.24em;color:#8b8fa3}
/* translate */
.cx-tr{background:#f4f6f8;border-radius:1em;padding:1em}
.tr-head{display:flex;align-items:center;justify-content:space-between;padding:0 .3em .6em}
.tr-logo{font-weight:800;color:var(--ac);font-size:1.05em}
.tr-lang{display:flex;align-items:center;justify-content:center;gap:1.2em;background:#fff;border-radius:999px;padding:.45em;margin-bottom:.7em;font-weight:700;font-size:.82em}
.tr-lang b{color:var(--ac)}
.tr-card{background:#fff;border-radius:.8em;padding:1em 1.1em .7em;margin-bottom:.6em;box-shadow:0 .1em .4em rgba(0,0,0,.05)}
.tr-out{background:var(--ac);color:#fff}
.tr-txt{font-size:1.15em;line-height:1.55;min-height:3em;font-weight:500}
.tr-ic{display:flex;gap:.9em;align-items:center;margin-top:.7em;font-size:.72em;color:#999}
.tr-out .tr-ic{color:rgba(255,255,255,.85)}
.tr-ic i{font-style:normal}.tr-ic span{margin-left:auto}
.tr-note{text-align:center;font-size:.62em;color:#9aa;font-family:'Playfair Display','Pretendard',serif;font-style:italic;letter-spacing:.02em}
/* movie */
.cx-mv{display:flex;flex-direction:column;gap:.8em}
.mv{background:#000;aspect-ratio:16/9;display:flex;flex-direction:column}
.mv-bar{height:11.2%;display:flex;align-items:center;box-sizing:border-box;justify-content:space-between;padding:0 4.2%;color:#c9c9c9;font-size:.6em;letter-spacing:.16em;flex:none}
.mv-bar.bot{height:11.2%}
.mv-bar.mv-tb{align-items:flex-end;padding-bottom:1.1%}
.mv-img{position:relative;flex:1;background:#3a3438 center/cover no-repeat;overflow:hidden}
.mv-dark{position:absolute;inset:0;background:#000}

/* parsing */
const fpos=o=>`background-position:${o&&o.fx!=null?o.fx:50}% ${o&&o.fy!=null?o.fy:50}%`;
function photoHTML(n){
  const p=S.photos[n-1];if(!p)return `<span style="opacity:.5">[사진${n} 없음]</span>`;
  let a=1,b=1;if(S.pRatio==='orig'){a=p.w||1;b=p.h||1}else[a,b]=S.pRatio.split(':').map(Number);
  return `<span class="ph" style="aspect-ratio:${a}/${(b*S.pH/100).toFixed(3)};background-image:url(${p.src});${fpos(p)};border-radius:${S.pRadius}px" data-img="p:${n-1}"></span>`;
}
function styleWrap(k,t){
  if(k==='h1')return `<mark class="hl1">${t}</mark>`;
  if(k==='h2')return `<mark class="hl2">${t}</mark>`;
  if(k==='c1')return `<span style="color:var(--c1)">${t}</span>`;
  if(k==='c2')return `<span style="color:var(--c2)">${t}</span>`;
  if(/^#[0-9a-f]{3,8}$/i.test(k))return `<span style="color:${k}">${t}</span>`;
  if(/^\d{1,3}$/.test(k))return `<span style="font-size:${k}px;line-height:1.3">${t}</span>`;
  return '\u0001'+k+'|'+t+'\u0002';
}
function inline(raw){
  const ph=[];let s=esc(raw).replace(/\[사진(\d+)\]/g,(m,n)=>{ph.push(photoHTML(+n));return '\u0000'+(ph.length-1)+'\u0000'});
  s=s.replace(/\{\{(#[0-9a-f]{3,8}):(.+?)\}\}/gi,'<span style="color:$1">$2</span>')
     .replace(/==(#[0-9a-f]{3,8}):(.+?)==/gi,(m,c,t)=>`<mark style="background:${rgba(c,S.hl1a/100)};color:inherit;padding:0 .1em;border-radius:.12em">${t}</mark>`)
     .replace(/==(.+?)==/g,'<mark class="hl1">$1</mark>');
  s=s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*([^*]+?)\*/g,'<i>$1</i>').replace(/__(.+?)__/g,'<u>$1</u>').replace(/~~(.+?)~~/g,'<s>$1</s>').replace(/\|\|(.+?)\|\|/g,'<span class="cen">$1</span>');
  let prev;do{prev=s;s=s.replace(/\{([^{}|\u0001\u0002]+)\|([^{}]*)\}/g,(m,k,t)=>styleWrap(k.trim(),t))}while(s!==prev);
  return s.replace(/\u0001/g,'{').replace(/\u0002/g,'}').replace(/\u0000(\d+)\u0000/g,(m,i)=>ph[+i]);
}
function parse(text){
  const out=[];
  for(let line of text.split('\n')){
    line=line.replace(/\s+$/,'');let m,time='';
    if(m=line.match(/\s*<\[(.+?)\]>\s*$/)){time=m[1];line=line.slice(0,m.index)}
    if(!line.trim()){out.push({t:'gap'});continue}
    if(m=line.match(/^(#{1,3})\s+(.*)$/)){out.push({t:'h'+m[1].length,s:m[2]});continue}
    if(/^-{3,}$/.test(line.trim())){out.push({t:'hr',s:''});continue}
    if(m=line.match(/^--\s+(.+?)\s+--$/)){out.push({t:'hr',s:m[1]});continue}
    if(m=line.match(/^\[구분선(.*)\]$/)){const ps=m[1].split('|').slice(1).map(x=>x.trim());out.push({t:'hr2',st:ps[0]||'실선',sym:ps[1]||'',col:/^#[0-9a-f]{3,8}$/i.test(ps[2]||'')?ps[2]:'',th:Math.max(1,Math.min(20,parseFloat(ps[3])||2)),len:Math.max(5,Math.min(100,parseFloat(ps[4])||100))});continue}
    if(m=line.match(/^\[s\]\s?(.*)$/i)){out.push({t:'sys',s:m[1]});continue}
    if(m=line.match(/^\[-\]\s?(.*)$/)){const last=out[out.length-1];if(last&&last.t==='bub')last.tr.push(m[1]);else out.push({t:'tr',s:m[1]});continue}
    if(m=line.match(/^\[([1-5]|e)\]\s?(.*)$/i)){out.push({t:'bub',sp:/e/i.test(m[1])?4:+m[1]-1,s:m[2],tr:[],time});continue}
    if(m=line.match(/^>\s?(.*)$/)){out.push({t:'quote',s:m[1]});continue}
    out.push({t:'p',s:line,time});
  }
  return out;
}
const avCache={};
function defaultAvatar(color){
  if(avCache[color])return avCache[color];
  const c=document.createElement('canvas');c.width=c.height=200;const x=c.getContext('2d');
  x.fillStyle=color;x.fillRect(0,0,200,200);x.fillStyle='rgba(255,255,255,.92)';
  x.beginPath();x.arc(100,78,36,0,Math.PI*2);x.fill();
  x.beginPath();x.ellipse(100,182,64,58,0,Math.PI,0);x.fill();
  return avCache[color]=c.toDataURL('image/png');
}
const avSrc=sp=>sp.avatar||(sp.extra?defaultAvatar(sp.avColor||'#b8c4d6'):'');
const avStyle=sp=>avSrc(sp)?`background-image:url(${avSrc(sp)})`:`background-color:${sp.bubble};color:${sp.color}`;
const initial=sp=>avSrc(sp)?'':esc((sp.name||'?').slice(0,1));
function bubble(b,cont,last,glast){
  const sp=S.profiles[b.sp],side=sp.side,body=inline(b.s),tm=b.time?esc(b.time):'',T=S.theme;
  if(T==='messenger'){
    const av=S.showAvatar?`<div class="av mav${glast?'':' ghost'}" style="${avStyle(sp)};border-color:${sp.bubble}">${initial(sp)}</div>`:'';
    const nm=S.showName&&!cont?`<div class="mname">${esc(sp.name)}</div>`:'';
    const photo=/^\s*\[사진\d+\]\s*$/.test(b.s);
    return `<div class="msg ${side}${cont?' cont':''}">${av}<div class="mcol">${nm}<div class="mrow"><div class="bub${photo?' photo':''}" style="background:${sp.bubble};color:${sp.color}">${body}${b.tr.map(t=>`<span class=\"btr\">${inline(t)}</span>`).join('')}</div>${tm?`<span class="mtime">${tm}</span>`:''}</div></div></div>`;
  }
  if(T==='timeline'){
    const head=cont&&!tm?'':`<div class="tl-head">${S.showAvatar?`<span class="av" style="${avStyle(sp)}">${initial(sp)}</span>`:''}${S.showName?`<b>${esc(sp.name)}</b>`:''}${tm?`<span class="tm">· ${tm}</span>`:''}</div>`;
    return `<div class="tl${last?' last':''}"><span class="tl-dot" style="background:${sp.bubble}"></span>${head}<div class="tl-card" style="background:${sp.bubble};color:${sp.color}">${body}${b.tr.map(t=>`<span class="btr">${inline(t)}</span>`).join('')}</div></div>`;
  }
  if(T==='game'){
    const port=S.showAvatar?`<div class="gport" style="${avStyle(sp)};box-shadow:0 0 0 .1em ${sp.color}">${initial(sp)}</div><span class="gsep" style="background:${sp.color}"></span>`:'';
    return `<div class="gm ${side}${cont?' cont':''}"><div class="gbox" style="background:${sp.bubble};color:${sp.color};border-color:${sp.color}">${cont||!S.showName?'':`<span class="gname" style="background:${sp.color};color:${sp.bubble}">${esc(sp.name)}</span>`}${port}<div class="gtxt">${body}${b.tr.map(t=>`<span class="btr">${inline(t)}</span>`).join('')}</div><span class="gnext">▼</span></div></div>`;
  }
  return `<div class="scr"><span class="n" style="color:${sp.color}">${cont?'':esc(sp.name)}</span><span>${body}${tm?`<span class="c-tm">${tm}</span>`:''}${b.tr.map(t=>`<span class="btr">${inline(t)}</span>`).join('')}</span></div>`;
}
function hr2HTML(b){const st={'점선':'dotted','이중선':'double','없음':'none'}[b.st]||'solid';
  return `<div class="c-hr2 hs-${st}${b.sym?'':' nosym'}${b.col?' cc':''}" style="width:${b.len}%;--ht:${b.th}px;${b.col?`--hc:${b.col};`:''}"><i></i>${b.sym?`<b>${inline(b.sym)}</b>`:''}<i></i></div>`}
function bodyHTML(){
  const bl=parse(S.text);let prev=-1,h='';
  bl.forEach((b,i)=>{
    if(b.t==='bub'){const nx=bl[i+1];h+=bubble(b,b.sp===prev,!nx||nx.t!=='bub',!(nx&&nx.t==='bub'&&nx.sp===b.sp));prev=b.sp;return}
    prev=-1;
    switch(b.t){
      case 'gap':h+='<div class="c-gap"></div>';break;
      case 'h1':case 'h2':case 'h3':h+=`<div class="c-${b.t}">${inline(b.s)}</div>`;break;
      case 'hr2':h+=hr2HTML(b);break;
      case 'hr':h+=`<div class="c-hr${b.s?'':' plain'}">${b.s?inline(b.s):''}</div>`;break;
      case 'sys':h+=`<div class="c-sys">${inline(b.s)}</div>`;break;
      case 'tr':h+=`<div class="c-tr">${inline(b.s)}</div>`;break;
      case 'quote':h+=`<div class="c-quote">${inline(b.s)}</div>`;break;
      default:h+=`<div class="c-p">${inline(b.s)}${b.time?`<span class="c-tm">${esc(b.time)}</span>`:''}</div>`;
    }
  });
  return h;
}

function mainImgHTML(H){

  if(side){st+=`width:${Math.round(innerW*m.size/100)+ex}px;margin-top:${-ex}px;margin-bottom:${-ex}px;margin-${m.pos}:${-ex}px;`}
  else{st+=`height:${Math.round(innerH*m.size/100)+ex}px;margin-left:${-ex}px;margin-right:${-ex}px;margin-${m.pos}:${-ex}px;`}
  return `<div class="mimg" style="${st}" data-img="p:${m.idx}"></div>`;
}

 calls(c){const KIND={'부재중 통화':'miss','걸려온 전화':'in','통화 받음':'ok'},LBL={miss:'부재중 전화',in:'걸려온 전화',ok:'통화 받음',out:'발신 전화',video:'영상 통화'};

  const KW=/(부재중(\s*전화)?|발신(\s*전화)?|수신|영상(\s*통화)?|걸려온\s*전화|통화\s*받음)\s*[·,|]?\s*/g;

/* zoom */
function fit(){
  const c=$('#card'),W=c.offsetWidth,H=c.offsetHeight,st=$('#stage');
  const cs=getComputedStyle(st),aw=st.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),ah=st.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  if(zoomMode==='fit')zoom=Math.max(.05,Math.min(aw/W,ah/H));else if(zoomMode==='w')zoom=Math.max(.05,aw/W);else if(zoomMode==='h')zoom=Math.max(.05,ah/H);
  $('#scaler').style.transform=`scale(${zoom})`;$('#holder').style.width=W*zoom+'px';$('#holder').style.height=H*zoom+'px';
  $('#zLbl').textContent=Math.round(zoom*100)+'%';
}

/* color popup */
let cpTab='h',cpSlot=1;
const cpKey=()=>(cpTab==='h'?'hl':'c')+cpSlot;
function syncColorUI(){
  [['dC1','c1'],['dC2','c2'],['dH1','hl1'],['dH2','hl2']].forEach(([id,k])=>{const d=$('#'+id);if(d)d.style.background=k.startsWith('hl')?rgba(S[k],Math.max(.35,S[k+'a']/100)):S[k]});
  $('#tH').style.color=S.c1;$('#tA').style.background=rgba(S.hl1,S.hl1a/100);
  if($('#cpop').hidden)return;
  $('#cpTitle').textContent=cpTab==='h'?'🖍 형광펜 색':'🎨 글자색';
  $$('.cp-slots button').forEach(b=>b.classList.toggle('on',+b.dataset.slot===cpSlot));
  const nm=cpTab==='h'?'형광펜':'글자색',pre=cpTab==='h'?'hl':'c';
  $('#cpL1').textContent=nm+' 1';$('#cpL2').textContent=nm+' 2';
  $('#cpS1').style.background=S[pre+'1'];$('#cpS2').style.background=S[pre+'2'];
  const k=cpKey(),v=S[k];
  if(/^#[0-9a-f]{6}$/i.test(v))$('#cpColor').value=v;
  if(document.activeElement!==$('#cpHex'))$('#cpHex').value=String(v).toUpperCase();
  const sw=cpTab==='h'?SW_H:SW_C;
  $('#cpSw').innerHTML=sw.map(c=>`<button data-sw="${c}" style="background:${c}" class="${c.toLowerCase()===String(v).toLowerCase()?'on':''}"></button>`).join('');
  $('#cpAlphaBox').hidden=cpTab!=='h';
  if(cpTab==='h'){$('#cpAlpha').value=S[k+'a'];$('#cpAv').textContent=S[k+'a']+'%'}
  $('#cpPrev').innerHTML=cpTab==='h'?`미리보기 <mark style="background:${rgba(v,S[k+'a']/100)};padding:0 3px;border-radius:3px">형광펜 글자</mark> 입니다`:`미리보기 <span style="color:${v};font-weight:800">글자색</span> 입니다`;
}
function setColor(v){if(!/^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(v))return;if(v.length===4)v='#'+v.slice(1).split('').map(x=>x+x).join('');S[cpKey()]=v;syncColorUI();schedule()}
function closeCp(){$('#cpop').hidden=true;$$('.caret').forEach(c=>c.classList.remove('on'))}
$$('.caret').forEach(btn=>btn.onclick=e=>{e.stopPropagation();const p=$('#cpop'),same=!p.hidden&&cpTab===btn.dataset.cp;closeCp();if(same)return;
  cpTab=btn.dataset.cp;cpSlot=1;p.hidden=false;btn.classList.add('on');
  const ed=$('#editor').getBoundingClientRect(),br=btn.getBoundingClientRect(),w=Math.min(330,ed.width-16);
  p.style.right='auto';p.style.left=Math.max(8,Math.min(ed.width-w-8,br.left-ed.left-w/2+br.width/2))+'px';p.style.top=(br.bottom-ed.top+8)+'px';syncColorUI()});
$('#cpX').onclick=closeCp;
$('#cpop').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.slot){cpSlot=+b.dataset.slot;syncColorUI()}
  if(b.dataset.sw)setColor(b.dataset.sw)});
$('#cpColor').addEventListener('input',e=>setColor(e.target.value));
$('#cpHex').addEventListener('input',e=>{let v=e.target.value.trim();if(v&&v[0]!=='#')v='#'+v;setColor(v)});

function syncUI(){
  $$('[data-k]').forEach(el=>{const v=getK(el.dataset.k);if(v===undefined)return;
    if(el.type==='checkbox')el.checked=!!v;else if(el.type==='color'){if(/^#[0-9a-f]{6}$/i.test(v))el.value=v}else if(document.activeElement!==el)el.value=v});
  $$('[data-show]').forEach(el=>{const v=getK(el.dataset.show);el.textContent=(typeof v==='number'?+v.toFixed(2):v)+(el.dataset.unit||'')});
  $$('[data-seg]').forEach(g=>{const v=String(getK(g.dataset.seg));g.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))});
  $$('[data-when]').forEach(el=>{const [k,vs]=el.dataset.when.split(':');el.hidden=!vs.split(',').includes(String(getK(k)))});
  $$('#posGrid button').forEach(b=>b.classList.toggle('on',b.dataset.pos===S.main.pos));
  $('#fontName').textContent=S.customFont?'등록됨: '+S.customFont.name:'';
  syncColorUI();
}

    case 'preOut':saveFile('taetae-preset.json',new Blob([JSON.stringify({taetaePreset:2,n:($('#preName').value.trim()||'TAE❣TAE 프리셋'),s:fullState()})],{type:'application/json'}),'프리셋');break;
    case 'preIn':$('#fPreset').click();break;
    case 'bkOut':saveFile('taetae-backup.json',new Blob([JSON.stringify(S)],{type:'application/json'}),'백업');break;
    case 'bkIn':$('#fBackup').click();break;
    case 'bkNew':confirmBox('지금 작업을 지우고 처음부터 시작할까요?',()=>{S=DEF();selStk=-1;rebuildAll();toast('새로 시작했어요')});break;

function imgRef(r){const [a,b,c2]=String(r).split(':');if(a==='p')return S.photos[+b]||null;if(a==='cx')return cxImg((S.cx[b]||{})[c2]);return null}

/* presets */

/* ---------- read presets saved by the other excerpt site ---------- */
function isForeign(d){return isObj(d)&&('chatTheme' in d||'bgHtml' in d||'hlColors' in d||(Array.isArray(d.profiles)&&d.profiles[0]&&'bubbleBg' in d.profiles[0]))}
function fromForeign(d){
  const o=DEF(),num=(v,f)=>{v=Number(v);return isFinite(v)?v:f},hex=v=>typeof v==='string'&&/^#[0-9a-f]{3,8}$/i.test(v)?v:null;
  if(typeof d.text==='string')o.text=d.text;
  if(Array.isArray(d.hlColors)){o.hl1=hex(d.hlColors[0])||o.hl1;o.hl2=hex(d.hlColors[1])||o.hl2}
  if(Array.isArray(d.textColors)){o.c1=hex(d.textColors[0])||o.c1;o.c2=hex(d.textColors[1])||o.c2}
  o.theme={kakao:'messenger',messenger:'messenger',timeline:'timeline',game:'game',script:'script'}[d.chatTheme]||'messenger';
  if(RATIOS[d.ratio])o.ratio=d.ratio;
  o.font={'Noto Serif KR':'Nanum Myeongjo','Nanum Myeongjo':'Nanum Myeongjo','Nanum Gothic':'Nanum Gothic',Paperlogy:'Paperlogy'}[d.font]||'Pretendard';
  o.fontSize=num(d.fontSize,o.fontSize);o.letter=num(d.letterSpacing,o.letter);o.lh=num(d.lineHeightMult,o.lh);o.pad=num(d.padding,o.pad);
  o.vAlign={middle:'center',center:'center',bottom:'bottom'}[d.vAlign]||'top';
  if(hex(d.ink)){o.tcMode='custom';o.textColor=d.ink}
  const b=o.bg;if(hex(d.bg))b.color=d.bg;
  const bt=String(d.bgType||'');
  if(bt==='html'){b.type='html';b.html=d.bgHtml||''}
  else if(/grad/.test(bt)){b.type='gradient';b.g1=hex(d.gradA)||b.g1;b.g2=hex(d.gradB)||b.g2;b.gKind=d.gradType==='radial'?'radial':'linear';b.gAngle=num(d.gradAngle,135)}
  else if(/pat/.test(bt)){b.type='pattern';b.pType={dot:'dot',dots:'dot',check:'check',stripe:'stripe',diagonal:'stripe',grid:'grid',heart:'heart'}[d.patType]||'check';b.pColor=hex(d.patColor)||b.pColor;b.pSize=num(d.patSize,28);b.pAlpha=Math.round(num(d.patOpacity,.3)*100)}
  else if(/im/.test(bt)&&d.bgImgData){b.type='image';b.img=d.bgImgData;b.imgZoom=Math.round(num(d.bgZoom,1)*100);b.ovColor=hex(d.bgDimColor)||b.ovColor;b.ovAlpha=Math.round(num(d.bgDim,.45)*100);b.imgBlur=num(d.bgBlur,0)}
  else b.type='solid';
  if(typeof d.bgHtml==='string'&&!b.html)b.html=d.bgHtml;
  const photos=(d.chatImages||[]).map(x=>typeof x==='string'?{src:x,w:0,h:0}:(x&&(x.data||x.src))?{src:x.data||x.src,w:x.w||0,h:x.h||0}:null);
  o.photos=photos;
  if(d.insertImgData){o.photos.push({src:d.insertImgData,w:0,h:0});o.main.idx=o.photos.length-1;o.main.on=!!d.showInsert;
    o.main.pos=['top','left','right','bottom'].includes(d.insertPos)?d.insertPos:'top';
    const W=o.width,H=Math.round(W*(RATIOS[o.ratio]||4/3)),side=o.main.pos==='left'||o.main.pos==='right';
    o.main.size=Math.max(15,Math.min(85,Math.round(num(d.insertSize,380)/((side?W:H)-o.pad*2)*100)));
    o.main.edge=o.pad;o.tw=40;o.main.radius=num(d.insertRadius,16);o.main.gap=num(d.insertGap,30);o.main.bw=num(d.insertBorder,0);if(hex(d.ink))o.main.bc=d.ink}
  (d.profiles||[]).slice(0,4).forEach((p,i)=>{if(!isObj(p))return;const t=o.profiles[i];
    if(typeof p.name==='string')t.name=p.name;t.side=p.align==='right'?'R':'L';t.bubble=hex(p.bubbleBg)||t.bubble;t.color=hex(p.textColor)||t.color;t.avatar=p.avatarData||''});
  o.stickers=(d.stickers||[]).filter(x=>x&&(x.data||x.src)).map(x=>{let r=num(x.rot,0);if(Math.abs(r)<=6.3)r=r*180/Math.PI;
    const w=num(x.w,300),h=w*num(x.aspect,1);return{src:x.data||x.src,x:Math.round(num(x.x,0)-w/2),y:Math.round(num(x.y,0)-h/2),w:Math.round(w),rot:Math.round(r),bw:num(x.borderW,12),bc:hex(x.borderColor)||'#ffffff',shadow:!!x.shadow,lock:!!x.lock}});
  return o;
}
function normalizeImport(d){if(isObj(d)&&isObj(d.s))return{n:d.n,s:isForeign(d.s)?fromForeign(d.s):d.s,style:d.taetaePreset===1};if(isForeign(d))return{n:d.name,s:fromForeign(d)};return{n:d&&d.n,s:d}}
function fullState(){return JSON.parse(JSON.stringify(S))}
let presetCount=0;
const IDB=(()=>{let p=null;return()=>p||(p=new Promise((res,rej)=>{try{const r=indexedDB.open('taetae',1);r.onupgradeneeded=()=>r.result.createObjectStore('presets',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}))})();
function tx(mode,fn){return IDB().then(db=>new Promise((res,rej)=>{const t=db.transaction('presets',mode),st=t.objectStore('presets');const r=fn(st);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)}))}
const presetAll=()=>tx('readonly',st=>st.getAll()).catch(()=>[]);
const presetGet=id=>tx('readonly',st=>st.get(id)).catch(()=>null);
const presetAdd=p=>tx('readwrite',st=>st.add({...p,t:Date.now()}));
const presetDel=id=>tx('readwrite',st=>st.delete(id)).catch(()=>{});
async function migrateOldPresets(){try{const old=JSON.parse(localStorage.getItem(LS_PRE)||'[]');if(old.length){for(const p of old)await presetAdd({n:p.n,s:deepMerge(fullState(),p.s)});localStorage.removeItem(LS_PRE)}}catch(e){}}
async function buildPresets(){const ps=await presetAll();presetCount=ps.length;$('#preCnt').textContent=`(${ps.length})`;
  $('#preList').innerHTML=ps.length?ps.map(p=>`<div class="it"><span>♡ ${esc(p.n)}</span><button class="btn sm" data-pl="${p.id}">불러오기</button><button class="btn sm" data-pd="${p.id}">삭제</button></div>`).join(''):'<div class="help">보관함이 비어 있어요.</div>'}
async function applyFull(st){S=deepMerge(DEF(),JSON.parse(JSON.stringify(st)));await Promise.all((S.photos||[]).map(async x=>{if(x&&!x.w){try{const im=await loadImg(x.src);x.w=im.naturalWidth;x.h=im.naturalHeight}catch(e){}}}));if(S.customFont)await registerFont(S.customFont.data).catch(()=>{S.customFont=null});selStk=-1;rebuildAll()}
function applyStyle(p){S=deepMerge(S,JSON.parse(JSON.stringify(p)));rebuildAll()}

/* autosave */
let saveT=0,warned=false;
function autosave(){clearTimeout(saveT);saveT=setTimeout(()=>{
  try{localStorage.setItem(LS_WORK,JSON.stringify(S))}catch(e){
    try{const lite={...S,photos:[],stickers:[],customFont:null,bg:{...S.bg,img:''},main:{...S.main,on:false},profiles:S.profiles.map(p=>({...p,avatar:''}))};localStorage.setItem(LS_WORK,JSON.stringify(lite));
      if(!warned){warned=true;toast('이미지 용량이 커서 글과 설정만 자동 저장돼요. 전체 백업을 이용해 주세요')}}catch(e2){}
  }},700)}

/* export */
async function ensureFonts(){
  const tx=($('#card').innerText||'가').slice(0,3000)+'가나다ABC123';
  const fam=S.font==='__user'?'UserFont':S.font;
  await Promise.all([fam,'Pretendard'].flatMap(f=>['400','700'].flatMap(w=>[document.fonts.load(`${w} 30px "${f}"`,tx).catch(()=>{}),document.fonts.load(`italic ${w} 30px "${f}"`,tx).catch(()=>{})])));
  await document.fonts.ready;
}
const FONT_FILES={'Pretendard':[['fonts/PretendardVariable.woff2','45 920']],'Paperlogy':[['fonts/Paperlogy-4Regular.woff2','400'],['fonts/Paperlogy-7Bold.woff2','700']],
  'Nanum Myeongjo':[['fonts/NanumMyeongjo.woff2','400'],['fonts/NanumMyeongjoBold.woff2','700']],'Nanum Gothic':[['fonts/NanumGothic.woff2','400'],['fonts/NanumGothicBold.woff2','700']]};
const fontData={};
const blobToDataURL=b=>new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(b)});
async function embeddedFontCSS(cssText){
  const fams=new Set(['Pretendard',S.font]);
  for(const f of Object.keys(FONT_FILES))if(cssText.includes(f))fams.add(f);
  let out='';
  const embed=async url=>{if(!fontData[url]){const res=await fetch(url);if(!res.ok)throw new Error('font');fontData[url]=(await blobToDataURL(await res.blob())).replace(/^data:[^;]*;/,'data:font/woff2;')}return fontData[url]};
  for(const f of EN_FONTS){if(!(cssText.includes(f)||S.enFont===f))continue;for(const [url,w,st] of EN_FONT_FILES[f]){try{out+=`@font-face{font-family:'${f}';src:url(${await embed(url)}) format('woff2');font-weight:${w};font-style:${st};}`}catch(e){}}}
  for(const f of fams){for(const [url,w] of (FONT_FILES[f]||[])){
    if(!fontData[url]){const res=await fetch(url);if(!res.ok)throw new Error('font');fontData[url]=(await blobToDataURL(await res.blob())).replace(/^data:[^;]*;/,'data:font/woff2;')}
    out+=`@font-face{font-family:'${f}';src:url(${fontData[url]}) format('woff2');font-weight:${w};}`}}
  if(S.customFont)out+=`@font-face{font-family:'UserFont';src:url(${S.customFont.data});}`;
  for(const v of Object.values(S.cx||{}))if(v&&v.fontData&&cssText.includes('CxFont'))out+=`@font-face{font-family:'CxFont';src:url(${v.fontData.data});}`;
  return out;
}
async function renderExact(scale){
  const card=$('#card'),W=card.offsetWidth,H=card.offsetHeight;
  const clone=card.cloneNode(true);clone.classList.remove('preview');clone.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel'));
  clone.style.margin='0';
  let css=[...document.querySelectorAll('style')].map(x=>x.textContent).join('\n').replace(/@font-face\s*\{[^}]*\}/g,'');
  css=(await embeddedFontCSS(css+card.innerHTML))+css;
  const xml=new XMLSerializer().serializeToString(clone);
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W*scale}" height="${H*scale}" viewBox="0 0 ${W} ${H}"><foreignObject x="0" y="0" width="${W}" height="${H}"><div xmlns="http://www.w3.org/1999/xhtml" style="width:${W}px;height:${H}px;margin:0;padding:0"><style><![CDATA[${css.replace(/\]\]>/g,'')}]]></style>${xml}</div></foreignObject></svg>`;
  const img=new Image();img.decoding='sync';
  await new Promise((r,j)=>{img.onload=r;img.onerror=()=>j(new Error('svg'));img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)});
  try{await img.decode()}catch(e){}
  const c=document.createElement('canvas');c.width=Math.round(W*scale);c.height=Math.round(H*scale);const x=c.getContext('2d');
  x.drawImage(img,0,0,c.width,c.height);await new Promise(r=>setTimeout(r,120));x.clearRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise((r,j)=>{try{c.toBlob(b=>b?r(b):j(new Error('blob')),'image/png')}catch(e){j(e)}});
  return blob;
}
async function renderPNG(){
  const ps=selStk;selStk=-1;render();
  await Promise.all(S.stickers.map(s=>processSticker(s).catch(()=>{})));$('#stickers').innerHTML=stickersHTML();
  if(S.bg.type==='image'&&S.bg.img){await blurred();await new Promise(r=>setTimeout(r,80))}
  await ensureFonts();
  const scale=+S.exportScale||1;
  try{const b=await renderExact(scale);selStk=ps;return b}
  catch(err){console.warn('exact render failed, falling back',err)}
  if(typeof html2canvas!=='function')throw new Error('이미지 변환 도구를 불러오지 못했어요. 새로고침해 주세요.');
  const card=$('#card');
  const canvas=await html2canvas(card,{backgroundColor:null,scale,useCORS:true,logging:false,width:card.offsetWidth,height:card.offsetHeight,
    onclone:doc=>{const sc=doc.getElementById('scaler');sc.style.transform='none';sc.style.boxShadow='none';const st=doc.getElementById('stage');st.scrollTop=0;st.scrollLeft=0}});
  selStk=ps;toast('일부 꾸밈이 빠질 수 있는 호환 방식으로 저장했어요');return await new Promise(r=>canvas.toBlob(r,'image/png'));
}
async function saveFile(name,blob,label){
  const dl=dlPromise?await dlPromise:null;
  if(dl){try{await dl.save({filename:name,data:blob});toast(label+' 저장 완료')}catch(e){toast(e&&e.code==='declined'?'저장을 취소했어요':'저장하지 못했어요 ('+(e&&e.code||'오류')+')')}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}catch(e){toast('이 화면에서는 저장이 막혀 있어요')}
}
async function copyBlob(blob){try{await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);toast('클립보드에 복사했어요');return true}catch(e){toast('이 화면에서는 복사가 막혀 있어요. 이미지를 길게 누르거나 우클릭해 복사해 주세요');return false}}
let busy=false;
async function doExport(copy){
  if(busy)return;busy=true;toast('이미지를 만드는 중…');
  try{const blob=await renderPNG();const n=new Date(),p=v=>String(v).padStart(2,'0');const name=`TAETAE_${n.getFullYear()}${p(n.getMonth()+1)}${p(n.getDate())}_${p(n.getHours())}${p(n.getMinutes())}.png`;
    let ok=false;if(copy)ok=await copyBlob(blob);showResult(blob,name,ok,copy)}
  catch(e){toast(e.message||'이미지를 만들지 못했어요')}
  busy=false;render();
}
$('#qSave').onclick=()=>doExport(false);$('#qCopy').onclick=()=>doExport(true);
function showResult(blob,name,copied,copyMode){
  const url=URL.createObjectURL(blob),m=document.createElement('div');m.className='modal';
  blobToDataURL(blob).then(d=>{const im=m.querySelector('img');if(im)im.src=d}).catch(()=>{});
  m.innerHTML=`<div class="mbox"><div class="ttl">Proof of Excerpt ♡</div><img src="${url}" alt="결과 이미지"><div class="msg">${copyMode&&copied?'복사했어요! ':''}이미지를 길게 누르거나 우클릭해서 바로 저장·복사할 수도 있어요.</div><div class="btns" style="justify-content:flex-end"><button class="btn" data-a="copy">클립보드 복사</button><button class="btn pri" data-a="save">이미지 저장</button><button class="btn" data-a="close">닫기</button></div></div>`;
  m.onclick=e=>{const a=e.target.dataset.a;if(e.target===m||a==='close'){m.remove();URL.revokeObjectURL(url)}if(a==='save')saveFile(name,blob,'이미지');if(a==='copy')copyBlob(blob)};
  document.body.appendChild(m);if(!copyMode)saveFile(name,blob,'이미지');
}
function confirmBox(msg,yes,no,yesL='확인',noL='취소'){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="mbox" style="max-width:380px"><div class="ttl">TAE❣TAE</div><div class="msg" style="color:var(--ink);font-size:14px">${esc(msg)}</div><div class="btns" style="justify-content:flex-end"><button class="btn" data-a="n">${noL}</button><button class="btn pri" data-a="y">${yesL}</button></div></div>`;m.onclick=e=>{const a=e.target.dataset.a;if(a==='y'){m.remove();yes()}else if(a==='n'){m.remove();no&&no()}};document.body.appendChild(m)}


/* divider popup */
let hrLine='실선',hrSym='',hrCol='',hrTh=2,hrLen=100;
function hrText(){const sym=hrSym==='custom'?($('#hrCustom').value.trim().replace(/[|\]]/g,'')):hrSym;
  return (hrCol||hrTh!==2||hrLen!==100)?`[구분선|${hrLine}|${sym}|${hrCol}|${hrTh}|${hrLen}]`:`[구분선|${hrLine}${sym?'|'+sym:''}]`}
function syncHr(){$$('#hrLine button').forEach(b=>b.classList.toggle('on',b.dataset.hl===hrLine));$$('#hrSym button').forEach(b=>b.classList.toggle('on',b.dataset.hs===hrSym));$('#hrCustom').hidden=hrSym!=='custom';
  if(hrCol)$('#hrCol').value=hrCol;if(document.activeElement!==$('#hrHex'))$('#hrHex').value=hrCol;$('#hrThV').textContent=hrTh+'px';$('#hrLenV').textContent=hrLen+'%';
  $('#hrPrev').innerHTML=`<div style="--tc:var(--ink);font-size:15px">${hr2HTML(parse(hrText())[0])}</div>`}
$('#hrCol').addEventListener('input',e=>{hrCol=e.target.value;syncHr()});
$('#hrHex').addEventListener('input',e=>{let v=e.target.value.trim();if(v&&v[0]!=='#')v='#'+v;if(/^#[0-9a-f]{6}$/i.test(v)){hrCol=v;syncHr()}else if(!v){hrCol='';syncHr()}});
$('#hrColX').onclick=()=>{hrCol='';syncHr()};
$('#hrTh').addEventListener('input',e=>{hrTh=+e.target.value;syncHr()});
$('#hrLen').addEventListener('input',e=>{hrLen=+e.target.value;syncHr()});
function closeHr(){$('#hrpop').hidden=true;$('#hrOpen').classList.remove('on')}
$('#hrOpen').onclick=e=>{e.stopPropagation();const p=$('#hrpop');if(!p.hidden)return closeHr();closeCp();p.hidden=false;
  const ed=$('#editor').getBoundingClientRect(),br=$('#hrOpen').getBoundingClientRect(),w=Math.min(310,ed.width-16);
  p.style.left=Math.max(8,Math.min(ed.width-w-8,br.left-ed.left))+'px';p.style.top=(br.bottom-ed.top+8)+'px';syncHr()};
$('#hrX').onclick=closeHr;
$('#hrpop').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.hl){hrLine=b.dataset.hl;syncHr()}if(b.dataset.hs!==undefined){hrSym=b.dataset.hs;syncHr();if(hrSym==='custom')$('#hrCustom').focus()}});
$('#hrCustom').addEventListener('input',syncHr);
$('#hrIns').onclick=()=>{const t=ta(),a=t.selectionStart,ls=t.value.lastIndexOf('\n',a-1)+1;let le=t.value.indexOf('\n',a);if(le<0)le=t.value.length;
  const line=t.value.slice(ls,le),txt=hrText();
  if(!line.trim()){t.setRangeText(txt,ls,le,'end')}else{t.setRangeText('\n'+txt,le,le,'end')}
  t.focus();commitTA();closeHr();toast('구분선을 넣었어요')};
document.addEventListener('pointerdown',e=>{if(!$('#hrpop').hidden&&!e.target.closest('#hrpop')&&!e.target.closest('#hrOpen'))closeHr()});

/* concept panel */
function buildCx(){
  $('#cxGrid').innerHTML=CX.map(c=>`<button data-cx="${c.k}" class="${S.concept===c.k?'on':''}">${c.n}${c.d?`<i>${c.d}</i>`:''}</button>`).join('');
  const c=CXM[S.concept];const sec=$('#sec-cxf');
  if(!c||!c.f){sec.querySelector('.body').innerHTML='<div class="note">기본 모드에서는 발췌 탭의 본문·채팅 설정이 그대로 쓰여요. 위에서 컨셉을 하나 골라 보세요.</div>';return}
  const cur=S.cx[c.k];
  const fields=c.f.map(([k,l,t,d,mn,mx,u])=>{const key=`cx.${c.k}.${k}`;
    if(t==='img'){const im=cxImg(cur[k]);return row(l,`<span class="cximg" style="${im?`background-image:url(${im.src})`:''}"></span><button class="btn sm" data-cximg="${k}">${im?'바꾸기':'사진 올리기'}</button>${im?`<button class="btn sm" data-cximgx="${k}">빼기</button>`:''}`)}
    if(t==='font'){const opts=[['Pretendard','프리텐다드'],['Nanum Myeongjo','나눔 명조'],['Nanum Gothic','나눔 고딕'],['Paperlogy','페이퍼로지'],...EN_FONTS.map(f=>[f,f])];
      const ud=cur.fontData;return row(l,`<select data-k="${key}">${opts.map(([v,n])=>`<option value="${v}">${n}</option>`).join('')}${ud?`<option value="__cx">내 폰트: ${esc(ud.name)}</option>`:''}</select><button class="btn sm" data-cxfont="${k}">폰트 추가</button>`)}
    if(t==='area')return `<div class="row" style="grid-template-columns:1fr"><label>${l}</label><textarea data-k="${key}" rows="5" spellcheck="false"></textarea></div>`;
    if(t==='color')return col(l,key);
    if(t==='seg')return seg(l,key,mn.map(v=>[v,v]));
    if(t==='range')return rng(l,key,mn,mx,1,u||'');
    return txt(l,key,'')}).join('');
  sec.querySelector('.body').innerHTML=`<div class="note"><b>${c.n}</b> — ${c.help}</div>${fields}<div class="btns"><button class="btn sm tea" id="cxSample">예시 글 넣기</button></div><div class="help">사진은 미리보기에서 끌어서 보이는 부분을 맞출 수 있어요.</div>`;
  syncUI();
}
let cxImgKey='';
async function registerCxFont(url){const ff=new FontFace('CxFont',`url(${url})`);await ff.load();document.fonts.add(ff)}
$('#panes').addEventListener('click',e=>{
  const b=e.target.closest('[data-cx]');
  if(b){S.concept=b.dataset.cx;buildCx();schedule();if(S.concept!=='none'){const sec=$('#sec-cxf');sec.classList.remove('closed')}return}
  const ib=e.target.closest('[data-cximg]');if(ib){cxImgKey=ib.dataset.cximg;$('#fCx').click();return}
  const ix=e.target.closest('[data-cximgx]');if(ix){S.cx[S.concept][ix.dataset.cximgx]='';buildCx();schedule();return}
  const fb=e.target.closest('[data-cxfont]');if(fb){$('#fCxFont').click();return}
  if(e.target.id==='cxSample'){const c=CXM[S.concept];if(!c||!c.sample)return;const old=S.text;S.text=c.sample;$('#txt').value=S.text;schedule();toast('예시 글을 넣었어요','되돌리기',()=>{S.text=old;$('#txt').value=old;schedule()})}
});

$('#fCx').onchange=async e=>{const f=e.target.files[0];if(f&&cxImgKey){S.cx[S.concept][cxImgKey]=await shrink(f,2000,false);buildCx();schedule()}e.target.value=''};
$('#fCxFont').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const url=await readFile(f);await registerCxFont(url);const cur=S.cx[S.concept];cur.fontData={name:f.name.replace(/\.[^.]+$/,''),data:url};const fk=(CXM[S.concept].f.find(x=>x[2]==='font')||[])[0];if(fk)cur[fk]='__cx';buildCx();schedule();toast('폰트를 넣었어요')}catch(err){toast('폰트를 읽지 못했어요')}e.target.value=''};
/* init */
function rebuildAll(){clean();buildCx();buildProfiles();buildThumbs();buildStk();buildPresets();$('#txt').value=S.text;syncUI();schedule()}
(async()=>{
  let saved=null;try{const raw=localStorage.getItem(LS_WORK);if(raw)saved=JSON.parse(raw)}catch(e){}
  applyMode();await migrateOldPresets();rebuildAll();
  if(saved&&(saved.text!==SAMPLE||(saved.photos||[]).some(Boolean))){
    confirmBox('전에 작업하던 내용이 남아 있어요. 이어서 할까요?',async()=>{S=deepMerge(DEF(),saved);if(S.customFont)await registerFont(S.customFont.data).catch(()=>{S.customFont=null});rebuildAll();toast('이어서 불러왔어요')},()=>toast('처음부터 시작해요'),'이어서 하기','처음부터');
  }
  document.fonts.ready.then(()=>schedule());
})();
})();
